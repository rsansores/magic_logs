[package]
name = "fleet"
version = "0.0.0"
edition = "2021"
publish = false

# A workspace of its own, with a lockfile of its own.
[workspace]

[dependencies]
# Outside this repository, leave `path` out.
magic_logs = { version = "0.1.1", path = "../../magic_logs", features = ["serde"] }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "derive", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
