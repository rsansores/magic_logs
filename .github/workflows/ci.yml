name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs it on the commit it releases, and publishes only once it
  # is green.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, clippy and the docs, of the crates — with `serde` and
  # without — and of the fleet example.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            examples/fleet
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path examples/fleet/Cargo.toml --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path examples/fleet/Cargo.toml --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # What the crates depend on, and what the example does (it has a lockfile
  # of its own): advisories, licenses, sources, and nothing declared that
  # nothing uses.
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - examples/fleet/Cargo.toml
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check
          arguments: --locked
  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete
      - run: cargo machete . examples/fleet

  # The workflows themselves: an action not pinned to a commit, a token
  # that outlives its step, an expression a pull request can inject into a
  # script.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github
          advanced-security: false
          annotations: true
          version: 1.30.1
          # `$/…` for the release's call of this file is too new to rely on.
          min-severity: medium

  # The suite, against the oldest TimescaleDB and PostgreSQL it supports and
  # the newest: each test creates a database of its own, with the extension.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - timescale/timescaledb:2.21.0-pg15
          - timescale/timescaledb-ha:pg18.6-ts2.31.0
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The matrix is not part of the job it keys by.
          key: ${{ matrix.image }}
      - run: cargo test --locked --workspace --all-features

  # The derive's refusals, with the compiler's own words: held to the one
  # rustc the messages checked in were written with (`magic_logs/tests/derive.rs`
  # names it; the other jobs build what the derive accepts and leave the
  # words alone).
  diagnostics:
    runs-on: ubuntu-latest
    env:
      MAGIC_LOGS_PINNED_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          # The expected messages quote the crate's source, as rustc shows it.
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked -p magic_logs --test derive

  # What a host can name is what magic_logs/public-api/ lists: a change to
  # it is made there too, on purpose, and reviewed as one. The listing is
  # read off rustdoc's JSON, so the nightly is pinned.
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-10
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-public-api@0.52.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          cargo +nightly-2026-10-10 public-api -p magic_logs --all-features -s > "$RUNNER_TEMP/all-features.txt"
          diff -u magic_logs/public-api/all-features.txt "$RUNNER_TEMP/all-features.txt"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --workspace --all-features

  # The fleet: its server builds against the crate as it is.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/fleet
      - run: cargo build --locked --manifest-path examples/fleet/Cargo.toml

  # The explorer: its formatting, lint, types (the demo's too), unused
  # code, tests, and the packed tarball as npm and TypeScript read it.
  explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The pnpm version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: explorer/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: explorer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm lint
      # Checks the crate's answer in src/core/contract/fixtures/ against the
      # types generated from the crate's own rows, both of which the crate's
      # tests keep equal to what it serializes.
      - run: pnpm type-check
      - run: pnpm knip
      - run: pnpm test
      # Builds, packs, and lints the tarball as npm and TypeScript read it.
      - run: pnpm check:pack

  # Every link the documents and the rustdoc comments make into the
  # repository, anchors included, against the tree.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: lychee@0.24.2
      - run: scripts/check-links.sh

  # What a release publishes, packed and built from the tarballs as
  # crates.io will; and one version everywhere.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/check-versions.sh
      - run: cargo package --locked --workspace
