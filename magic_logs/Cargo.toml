[package]
name = "magic_logs"
description = "One PostgreSQL + TimescaleDB time-series table, and the queries a log explorer asks of it: keyset pages, histograms, facets and grouped counts, each read from the cheapest table that answers it"
keywords = ["timescaledb", "postgres", "logs", "explorer", "events"]
categories = ["database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/magic_logs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
magic_logs_derive = { version = "=0.1.0", path = "../magic_logs_derive" }
serde = { version = "1", features = ["derive"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "chrono", "derive", "uuid"] }
thiserror = "2"
uuid = "1"

[features]
# `Serialize` on the answers' rows, as `magic_logs_explorer` reads them.
serde = ["dep:serde", "chrono/serde"]

[dev-dependencies]
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "chrono", "uuid", "derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
trybuild = "1"

[package.metadata.docs.rs]
all-features = true
